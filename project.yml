name: JanScanner
options:
  bundleIdPrefix: com.xelaods
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  JanScanner:
    type: application
    platform: iOS
    sources:
      - path: JanScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xelaods.janscanner
        PRODUCT_NAME: JanScanner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 最安スキャン
        INFOPLIST_KEY_NSCameraUsageDescription: 商品のバーコード（JANコード）を読み取るためにカメラを使用します。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Manual
