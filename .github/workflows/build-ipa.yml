name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode のバージョン
        run: xcodebuild -version

      - name: XcodeGen でプロジェクト生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: APIキーを埋め込む
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
        run: |
          cat > JanScanner/Services/BuiltInKeys.swift <<SWIFT
          import Foundation
          enum BuiltInKeys {
              static let yahooClientID = "${YAHOO_CLIENT_ID}"
              static let rakutenApplicationID = "${RAKUTEN_APPLICATION_ID}"
              static let rakutenAccessKey = "${RAKUTEN_ACCESS_KEY}"
              static let rakutenReferer = "${RAKUTEN_REFERER}"
          }
          SWIFT
          echo "Yahoo: $([ -n "$YAHOO_CLIENT_ID" ] && echo 内蔵 || echo なし) / 楽天: $([ -n "$RAKUTEN_APPLICATION_ID" ] && echo 内蔵 || echo なし)"

      - name: ビルド（署名なし）
        run: |
          xcodebuild \
            -project JanScanner.xcodeproj \
            -scheme JanScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -100 || true
          exit $status

      - name: エラー内容を表示
        if: failure()
        run: grep -E "error:" -A3 build.log | head -150 || true

      - name: ipa を作成
        run: |
          APP="build/Build/Products/Release-iphoneos/JanScanner.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry JanScanner.ipa Payload
          ls -lh JanScanner.ipa

      - name: Artifact として保存
        uses: actions/upload-artifact@v4
        with:
          name: JanScanner-ipa
          path: JanScanner.ipa

      - name: リリースに添付
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 最安スキャン build ${{ github.run_number }}
          body: "未署名の ipa です。お手持ちの証明書で署名してインストールしてください。"
          files: JanScanner.ipa
          make_latest: true
